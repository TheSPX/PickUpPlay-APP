<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="PickupPlay — find a game, play at your level. By TheSPX" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="g" cx="78%" cy="40%" r="60%"><stop offset="0" stop-color="#14408f"/><stop offset="1" stop-color="#001645"/></radialGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#afd43a"/><stop offset="1" stop-color="#d4f06b"/></linearGradient>
    <clipPath id="r"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
    .ball{animation:hop 2.6s cubic-bezier(.45,.05,.55,.95) infinite}
    .shadow{animation:sh 2.6s cubic-bezier(.45,.05,.55,.95) infinite;transform-origin:930px 330px}
    .spin{animation:spin 2.6s linear infinite;transform-origin:0 0}
    .line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s ease-out .2s forwards}
    .fade{opacity:0;animation:fade .8s ease-out forwards}
    .f1{animation-delay:.1s}.f2{animation-delay:.35s}.f3{animation-delay:.6s}.f4{animation-delay:.85s}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes hop{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-150px)}}
    @keyframes sh{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(.45);opacity:.15}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.6}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="420" fill="url(#g)"/>
    <!-- court lines -->
    <g fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="2">
      <rect x="720" y="60" width="420" height="300" rx="10" class="line"/>
      <line x1="930" y1="60" x2="930" y2="360" class="line"/>
      <circle cx="930" cy="210" r="56" class="line"/>
    </g>
    <g opacity=".18"><circle cx="1080" cy="90" r="120" fill="#afd43a" class="pulse"/></g>
    <!-- ball -->
    <ellipse class="shadow" cx="930" cy="330" rx="34" ry="8" fill="#000"/>
    <g class="ball"><g transform="translate(930 290)"><g class="spin">
      <circle r="34" fill="url(#hl)"/>
      <path d="M-24-24C-6-10-6 10-24 24M24-24C6-10 6 10 24 24" stroke="#fff" stroke-opacity=".8" stroke-width="3" fill="none"/>
    </g></g></g>
    <!-- text -->
    <g class="fade f1"><rect x="72" y="86" width="232" height="34" rx="17" fill="#afd43a"/>
      <text x="188" y="109" text-anchor="middle" class="t" style="fill:#001645;font-size:15px;font-weight:800;letter-spacing:1.5px">NOW ON NJUPT CAMPUS</text></g>
    <text x="70" y="200" class="t fade f2" style="font-size:76px;font-weight:800;letter-spacing:-1.5px">PickupPlay</text>
    <text x="72" y="250" class="t fade f3" style="font-size:26px;font-weight:600;opacity:.85">Find a game. Play at your level.</text>
    <g class="fade f4">
      <text x="72" y="318" class="t" style="font-size:16px;font-weight:700;opacity:.65">Padel · Football · Basketball · Badminton · Billiards</text>
      <text x="72" y="360" class="t" style="font-size:15px;font-weight:800;fill:#afd43a">by TheSPX</text>
    </g>
  </g>
</svg>
