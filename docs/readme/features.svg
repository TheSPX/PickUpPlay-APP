<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Features: skill matching, game chat, fair teams, peer ratings, waitlist, live weather" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.h{font:800 22px "Segoe UI",Helvetica,Arial,sans-serif;fill:#0b1b3f}.d{font:500 16px "Segoe UI",Helvetica,Arial,sans-serif;fill:#5b6785}.c{fill:#fff;stroke:#e3e9cf}.ic{fill:#eef6d4}
.card{opacity:0;animation:in .7s ease-out forwards}.ring{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-color-scheme:dark){.h{fill:#f1f5f9}.d{fill:#94a3b8}.c{fill:#121b2e;stroke:#253049}.ic{fill:#1f2a12}.s{stroke:#afd43a}}</style>
<g class="card" style="animation-delay:0.00s"><rect class="c" x="20" y="20" width="373" height="205" rx="22" stroke-width="2"/><rect class="ic ring" x="48" y="48" width="56" height="56" rx="16"/><g transform="translate(76 76)"><path class="s" d="M-12 10V0M-4 10V-12M4 10V-4M12 10H-14" fill="none" stroke="#001645" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text class="h" x="48" y="145">Skill matching</text><text class="d" x="48" y="175">Games show their level range —</text><text class="d" x="48" y="198">never end up outmatched.</text></g>
<g class="card" style="animation-delay:0.15s"><rect class="c" x="413" y="20" width="373" height="205" rx="22" stroke-width="2"/><rect class="ic ring" x="441" y="48" width="56" height="56" rx="16"/><g transform="translate(469 76)"><path class="s" d="M14 2a10 10 0 0 1-14.5 9L-12 12l1.2-5.6A10 10 0 1 1 14 2z" fill="none" stroke="#001645" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text class="h" x="441" y="145">Game chat</text><text class="d" x="441" y="175">Every game gets its own</text><text class="d" x="441" y="198">group chat.</text></g>
<g class="card" style="animation-delay:0.30s"><rect class="c" x="806" y="20" width="373" height="205" rx="22" stroke-width="2"/><rect class="ic ring" x="834" y="48" width="56" height="56" rx="16"/><g transform="translate(862 76)"><path class="s" d="M6-12h7v7M-6 12h-7V5M13-12l-9 9M-13 12l9-9" fill="none" stroke="#001645" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text class="h" x="834" y="145">Fair teams</text><text class="d" x="834" y="175">One tap splits two balanced</text><text class="d" x="834" y="198">sides by skill and position.</text></g>
<g class="card" style="animation-delay:0.45s"><rect class="c" x="20" y="245" width="373" height="205" rx="22" stroke-width="2"/><rect class="ic ring" x="48" y="273" width="56" height="56" rx="16"/><g transform="translate(76 301)"><path class="s" d="M0-13 4-4.5l9.5 1.2-6.8 6.4 1.7 9.4L0 7.5-8.4 12.5l1.7-9.4-6.8-6.4L-4-4.5z" fill="none" stroke="#001645" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text class="h" x="48" y="370">Peer ratings</text><text class="d" x="48" y="400">Teammates keep everyone's</text><text class="d" x="48" y="423">level honest after each game.</text></g>
<g class="card" style="animation-delay:0.60s"><rect class="c" x="413" y="245" width="373" height="205" rx="22" stroke-width="2"/><rect class="ic ring" x="441" y="273" width="56" height="56" rx="16"/><g transform="translate(469 301)"><path class="s" d="M-6-8h18M-6 0h18M-6 8h18M-13-8h.01M-13 0h.01M-13 8h.01" fill="none" stroke="#001645" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text class="h" x="441" y="370">Waitlist</text><text class="d" x="441" y="400">Game full? Join the queue —</text><text class="d" x="441" y="423">you're in when a spot opens.</text></g>
<g class="card" style="animation-delay:0.75s"><rect class="c" x="806" y="245" width="373" height="205" rx="22" stroke-width="2"/><rect class="ic ring" x="834" y="273" width="56" height="56" rx="16"/><g transform="translate(862 301)"><path class="s" d="M8 10a6 6 0 1 0-1.8-11.7A8 8 0 1 0-6 7" fill="none" stroke="#001645" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text class="h" x="834" y="370">Live weather</text><text class="d" x="834" y="400">Forecast at the court for the</text><text class="d" x="834" y="423">hour your game starts.</text></g>
</svg>