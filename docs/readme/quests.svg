<text x="60" y="130" class="t" style="font-size:40px;font-weight:800">Level up off the court too</text>
<text x="60" y="168" class="t" style="font-size:19px;opacity:.75">New quests every day · Earn XP · Keep your streak alive</text>
<rect x="60" y="212" width="26" height="26" rx="8" fill="#0b2a6b"/><path class="chk" style="animation-delay:0.00s" d="M66 225l5 5 10-10" fill="none" stroke="#afd43a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="231" class="t" style="font-size:17px;font-weight:700">Walk</text><text x="250" y="231" class="t" style="font-size:15px;opacity:.6">6,000 steps</text><text x="420" y="231" class="t" style="font-size:15px;font-weight:900;fill:#afd43a">+20 XP</text>
