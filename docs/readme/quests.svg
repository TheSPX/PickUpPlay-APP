<rect x="60" y="326" width="26" height="26" rx="8" fill="#0b2a6b"/><path class="chk" style="animation-delay:1.05s" d="M66 339l5 5 10-10" fill="none" stroke="#afd43a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="345" class="t" style="font-size:17px;font-weight:700">Free throws</text><text x="250" y="345" class="t" style="font-size:15px;opacity:.6">30 shots</text><text x="420" y="345" class="t" style="font-size:15px;font-weight:900;fill:#afd43a">+20 XP</text>
