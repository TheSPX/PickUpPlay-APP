<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Daily Quests: complete daily challenges, earn XP and climb from E-Rank to S-Rank" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><clipPath id="r"><rect width="1200" height="380" rx="28"/></clipPath></defs>
<style>.t{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#fff}.bar{animation:fill 3.5s ease-in-out infinite}.rk{opacity:.35;animation:lit 3.5s ease-in-out infinite}
.chk{stroke-dasharray:30;stroke-dashoffset:30;animation:tick 3.5s ease-out infinite}
@keyframes fill{0%{width:0}70%,100%{width:520px}}@keyframes tick{0%,20%{stroke-dashoffset:30}35%,100%{stroke-dashoffset:0}}
@keyframes lit{0%,100%{opacity:.35}50%{opacity:1}}</style>
<g clip-path="url(#r)"><rect width="1200" height="380" fill="#001645"/><circle cx="1120" cy="40" r="180" fill="#afd43a" opacity=".07"/>
