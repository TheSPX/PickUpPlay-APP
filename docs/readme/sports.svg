<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Five sports: padel, football, basketball, badminton, billiards" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;font-weight:800;fill:#0b1b3f}
    .p{animation:float 3s ease-in-out infinite}
    .p2{animation-delay:.3s}.p3{animation-delay:.6s}.p4{animation-delay:.9s}.p5{animation-delay:1.2s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @media (prefers-color-scheme:dark){.t{fill:#f1f5f9}.bg{fill:#121b2e;stroke:#253049}}
  </style>
  <g class="p"><rect class="bg" x="20" y="38" width="200" height="64" rx="32" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <g transform="translate(58 70)" fill="none" stroke="#166534" stroke-width="3"><circle r="16"/><path d="M-10-11c6 4 6 18 0 22M10-11c-6 4-6 18 0 22"/></g><text x="88" y="77" class="t">Padel</text></g>
  <g class="p p2"><rect class="bg" x="252" y="38" width="210" height="64" rx="32" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <g transform="translate(290 70)" fill="none" stroke="#1e40af" stroke-width="3"><circle r="16"/><path d="m0-8 7 5-3 8h-8l-3-8z"/></g><text x="320" y="77" class="t">Football</text></g>
  <g class="p p3"><rect class="bg" x="494" y="38" width="230" height="64" rx="32" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <g transform="translate(532 70)" fill="none" stroke="#92400e" stroke-width="3"><circle r="16"/><path d="M-16 0h32M0-16v32M-11-11c6 6 6 16 0 22M11-11c-6 6-6 16 0 22"/></g><text x="562" y="77" class="t">Basketball</text></g>
  <g class="p p4"><rect class="bg" x="756" y="38" width="220" height="64" rx="32" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
    <g transform="translate(794 70)" fill="none" stroke="#6b21a8" stroke-width="3" stroke-linejoin="round"><path d="M0 4-9-14l9 3 9-3z"/><circle cy="9" r="5"/></g><text x="824" y="77" class="t">Badminton</text></g>
  <g class="p p5"><rect class="bg" x="1008" y="38" width="172" height="64" rx="32" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
    <g transform="translate(1046 70)" fill="none" stroke="#0f766e" stroke-width="3"><circle r="16"/><circle cx="2" cy="-2" r="7"/></g>
    <text x="1048" y="72" text-anchor="middle" style="font:900 9px Arial;fill:#0f766e">8</text><text x="1076" y="77" class="t">Billiards</text></g>
</svg>
