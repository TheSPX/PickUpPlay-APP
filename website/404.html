<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Out of bounds — PickupPlay</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#001645" />
  <link rel="icon" href="/assets/icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script>try { const t = localStorage.getItem('pp-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <!-- Self-contained styles: this page is served from any URL depth, so it doesn't rely on styles.css -->
  <style>
    :root {
      --navy: #001645; --lime: #afd43a; --bg: #ffffff; --surface: #f5f7ee; --border: #e3e9cf;
      --text: #0b1b3f; --muted: #5b6785; --court: #0b2a6b; --line: rgba(255,255,255,.55);
    }
    :root[data-theme="dark"] { --bg: #0b1220; --surface: #121b2e; --border: #253049; --text: #f1f5f9; --muted: #94a3b8; --court: #13254d; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0b1220; --surface: #121b2e; --border: #253049; --text: #f1f5f9; --muted: #94a3b8; --court: #13254d; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--border); }
    header img { height: 64px; width: auto; filter: brightness(0) saturate(100%) invert(8%) sepia(74%) saturate(4683%) hue-rotate(219deg) brightness(88%) contrast(107%); }   /* white logo → navy on light */
    :root[data-theme="dark"] header img { filter: none; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header img { filter: none; } }
    .theme-btn { background: none; border: 1.5px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
    .theme-btn svg { width: 18px; height: 18px; }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px 64px; }

    /* Scoreboard */
    .board {
      display: inline-flex; align-items: center; gap: 14px; background: var(--navy); color: #fff;
      padding: 12px 18px; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,22,69,.25); margin-bottom: 28px;
    }
    .board .team { font-size: 11px; font-weight: 800; letter-spacing: .12em; opacity: .7; }
    .board .digits { display: flex; gap: 6px; }
    .board .d {
      width: 52px; height: 64px; border-radius: 10px; background: #0b2a6b; display: grid; place-items: center;
      font-size: 42px; font-weight: 800; color: var(--lime); font-variant-numeric: tabular-nums;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
    }
    .board .clock { font-size: 12px; font-weight: 800; color: #fca5a5; display: flex; align-items: center; gap: 6px; }
    .board .clock i { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .2; } }

    /* Court */
    .court {
      position: relative; width: min(520px, 100%); aspect-ratio: 2 / 1; border-radius: 20px;
      background: var(--court); overflow: visible; box-shadow: 0 20px 40px rgba(0,22,69,.18);
    }
    .court::before { /* outer lines */
      content: ""; position: absolute; inset: 14px; border: 2px solid var(--line); border-radius: 8px;
    }
    .court .mid { position: absolute; top: 14px; bottom: 14px; left: 50%; border-left: 2px solid var(--line); }
    .court .circle { position: absolute; width: 22%; aspect-ratio: 1; border: 2px solid var(--line); border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .court .box { position: absolute; top: 30%; bottom: 30%; width: 12%; border: 2px solid var(--line); }
    .court .box.l { left: 14px; border-left: 0; }
    .court .box.r { right: 14px; border-right: 0; }
    .court .out {
      position: absolute; right: -8px; top: -14px; background: #ef4444; color: #fff; font-size: 11px; font-weight: 900;
      letter-spacing: .1em; padding: 6px 10px; border-radius: 999px; transform: rotate(8deg);
      box-shadow: 0 6px 14px rgba(239,68,68,.35);
    }

    /* Ball bouncing out of bounds */
    .ball {
      position: absolute; width: 34px; height: 34px; border-radius: 50%; background: var(--lime);
      box-shadow: inset -5px -5px 0 rgba(0,0,0,.12); left: 30%; top: 45%;
      animation: roll 3.2s cubic-bezier(.45,.05,.55,.95) infinite;
    }
    .ball::before, .ball::after { content: ""; position: absolute; inset: 4px; border: 2px solid rgba(255,255,255,.75); border-radius: 50%; }
    .ball::after { inset: 0; border-color: transparent; border-left-color: rgba(255,255,255,.75); border-right-color: rgba(255,255,255,.75); transform: rotate(45deg); }
    .shadow {
      position: absolute; width: 30px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.25); left: 30%; top: 78%;
      animation: shadow 3.2s cubic-bezier(.45,.05,.55,.95) infinite;
    }
    @keyframes roll {
      0%   { transform: translate(0, 0) rotate(0); }
      25%  { transform: translate(90px, -50px) rotate(180deg); }
      50%  { transform: translate(190px, 20px) rotate(360deg); }
      75%  { transform: translate(280px, -40px) rotate(540deg); opacity: 1; }
      92%  { transform: translate(360px, 30px) rotate(700deg); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0); opacity: 0; }
    }
    @keyframes shadow {
      0%   { transform: translateX(0) scale(1); opacity: .9; }
      25%  { transform: translateX(90px) scale(.6); opacity: .4; }
      50%  { transform: translateX(190px) scale(1); opacity: .9; }
      75%  { transform: translateX(280px) scale(.6); opacity: .4; }
      92%  { transform: translateX(360px) scale(1); opacity: 0; }
      100% { opacity: 0; }
    }
    @media (max-width: 520px) {
      @keyframes roll {
        0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(50px,-36px) rotate(180deg); }
        50% { transform: translate(110px,12px) rotate(360deg); } 75% { transform: translate(170px,-28px) rotate(540deg); opacity: 1; }
        92% { transform: translate(230px,20px) rotate(700deg); opacity: 0; } 100% { opacity: 0; }
      }
      @keyframes shadow {
        0% { transform: translateX(0); opacity: .9; } 25% { transform: translateX(50px) scale(.6); opacity: .4; }
        50% { transform: translateX(110px); opacity: .9; } 75% { transform: translateX(170px) scale(.6); opacity: .4; }
        92% { transform: translateX(230px); opacity: 0; } 100% { opacity: 0; }
      }
      .board .d { width: 44px; height: 56px; font-size: 36px; }
    }
    @media (prefers-reduced-motion: reduce) { .ball, .shadow, .board .clock i { animation: none; } }

    h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -0.015em; margin-top: 36px; }
    p.lead { color: var(--muted); font-size: 17px; max-width: 460px; margin: 10px auto 26px; line-height: 1.55; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 14px 22px; border-radius: 999px;
      font-weight: 800; font-size: 15px; transition: transform .15s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { background: var(--navy); color: #fff; box-shadow: 0 8px 20px rgba(0,22,69,.25); }
    .btn-lime { background: var(--lime); color: var(--navy); box-shadow: 0 8px 20px rgba(175,212,58,.35); }
    .ref { margin-top: 26px; font-size: 13px; color: var(--muted); }
    .ref code { background: var(--surface); border: 1px solid var(--border); padding: 3px 8px; border-radius: 8px; font-size: 12px; word-break: break-all; }
    footer { text-align: center; padding: 22px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<header>
  <a href="/" aria-label="PickupPlay home"><img src="/assets/icon.png" alt="PickupPlay" /></a>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main>
  <div class="board" aria-hidden="true">
    <span class="team">HOME</span>
    <div class="digits"><span class="d">4</span><span class="d">0</span><span class="d">4</span></div>
    <span class="clock"><i></i>NO GAME</span>
  </div>

  <div class="court" aria-hidden="true">
    <span class="mid"></span><span class="circle"></span>
    <span class="box l"></span><span class="box r"></span>
    <span class="shadow"></span><span class="ball"></span>
    <span class="out">OUT!</span>
  </div>

  <h1>That one's out of bounds</h1>
  <p class="lead">The page you're looking for isn't on this court. It may have moved, or the link might be mistyped.</p>

  <div class="actions">
    <a class="btn btn-primary" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
      Back to home
    </a>
    <a class="btn btn-lime" href="/#download">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Find a game
    </a>
  </div>

  <p class="ref">Missed shot: <code id="path"></code></p>
</main>

<footer>© <span id="yr"></span> PickupPlay · Built by SPX</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  document.getElementById('path').textContent = location.pathname + location.search;
  document.getElementById('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('pp-theme', root.dataset.theme); } catch (e) {}
  });
</script>
</body>
</html>
